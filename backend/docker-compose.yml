services:
  api:
    build: .
    container_name: xhs-watermark-backend
    restart: unless-stopped
    environment:
      PORT: "8787"
      GIT_COMMIT_SHA: "${GIT_COMMIT_SHA:-local}"
    ports:
      - "127.0.0.1:8787:8787"

  caddy:
    image: caddy:2-alpine
    container_name: xhs-watermark-caddy
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
